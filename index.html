<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラフル・フラスコ爆発タイマー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ上でReactコードを変換して動かすためのツール) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- SVGアイコンコンポーネント ---
    const Play = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>;
    const Pause = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
    const RotateCcw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>;
    const Volume2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;
    const VolumeX = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>;
    const Plus = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const Minus = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const Sparkles = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
    const Flame = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>;
    const FlaskConical = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 2v7.31"></path><path d="M14 9.3V2"></path><path d="M8.5 2h7"></path><path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path><path d="M5.52 16h12.96"></path></svg>;
    const RefreshCw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;

    // --- サウンドエンジン ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTap(freq = 520) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.4, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } catch (e) {}
      }
      playStart() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((note, idx) => {
            const now = this.ctx.currentTime + idx * 0.07;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note, now);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          });
        } catch (e) {}
      }
      playPhaseChange() {
        try {
          this.init();
          if (!this.ctx) return;
          const freqs = [330, 440, 554.37, 659.25];
          freqs.forEach((f, i) => {
            const now = this.ctx.currentTime + i * 0.06;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f * 1.25, now + 0.12);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
          });
        } catch (e) {}
      }
      playCountdownBeep(secondsLeft) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const baseFreq = secondsLeft <= 3 ? 880 : 660;
          osc.type = secondsLeft <= 3 ? 'sawtooth' : 'square';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.12, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } catch (e) {}
      }
      playExplosionAndFanfare() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          
          const bufferSize = this.ctx.sampleRate * 0.7;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(120, now + 0.65);
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.45, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.68);

          const boomOsc = this.ctx.createOscillator();
          const boomGain = this.ctx.createGain();
          boomOsc.type = 'sine';
          boomOsc.frequency.setValueAtTime(180, now);
          boomOsc.frequency.exponentialRampToValueAtTime(38, now + 0.45);
          boomGain.gain.setValueAtTime(0.5, now);
          boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
          boomOsc.connect(boomGain);
          boomGain.connect(this.ctx.destination);
          boomOsc.start(now);
          boomOsc.stop(now + 0.5);

          const fanfareNotes = [
            { f: 523.25, t: 0.18, d: 0.15 },
            { f: 659.25, t: 0.32, d: 0.15 },
            { f: 783.99, t: 0.46, d: 0.15 },
            { f: 1046.5, t: 0.62, d: 0.55 },
            { f: 783.99, t: 0.62, d: 0.55 },
          ];
          fanfareNotes.forEach(({ f, t, d }) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + t);
            gain.gain.setValueAtTime(0.25, now + t);
            gain.gain.exponentialRampToValueAtTime(0.001, now + t + d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + t);
            osc.stop(now + t + d);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    // --- メインアプリケーション ---
    function App() {
      const [totalSeconds, setTotalSeconds] = useState(180);
      const [remainingSeconds, setRemainingSeconds] = useState(180);
      const [status, setStatus] = useState('idle');
      const [isMuted, setIsMuted] = useState(false);
      const prevPhaseRef = useRef('blue');

      const phase = useMemo(() => {
        if (status === 'exploded' || remainingSeconds === 0) return 'exploded';
        if (status === 'idle') return 'blue';
        if (remainingSeconds <= 10) return 'red';
        const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 1;
        if (ratio <= 0.5) return 'yellow';
        return 'blue';
      }, [status, remainingSeconds, totalSeconds]);

      const theme = useMemo(() => {
        switch (phase) {
          case 'red':
            return {
              bgGradient: 'from-rose-950 via-red-900 to-slate-950',
              liquidPrimary: '#ef4444',
              liquidSecondary: '#f43f5e',
              liquidGlow: 'rgba(239, 68, 68, 0.75)',
              bubbleColor: '#fecdd3',
              badgeText: 'まもなく大爆発！！',
              badgeBg: 'bg-red-600 text-white border-red-300 animate-bounce',
              waveDuration: '1.1s',
              bubbleSpeedMultiplier: 0.35,
              bubbleCount: 38,
            };
          case 'yellow':
            return {
              bgGradient: 'from-amber-950 via-slate-900 to-slate-950',
              liquidPrimary: '#f59e0b',
              liquidSecondary: '#eab308',
              liquidGlow: 'rgba(245, 158, 11, 0.65)',
              bubbleColor: '#fef08a',
              badgeText: '化学反応が加速中！',
              badgeBg: 'bg-amber-500 text-slate-950 border-amber-200',
              waveDuration: '2.2s',
              bubbleSpeedMultiplier: 0.65,
              bubbleCount: 24,
            };
          case 'exploded':
            return {
              bgGradient: 'from-fuchsia-950 via-indigo-950 to-slate-950',
              liquidPrimary: '#ec4899',
              liquidSecondary: '#8b5cf6',
              liquidGlow: 'rgba(236, 72, 153, 0.8)',
              bubbleColor: '#ffffff',
              badgeText: 'TIME UP! 大爆発！',
              badgeBg: 'bg-pink-500 text-white border-yellow-300',
              waveDuration: '1s',
              bubbleSpeedMultiplier: 0.5,
              bubbleCount: 0,
            };
          case 'blue':
          default:
            return {
              bgGradient: 'from-slate-950 via-cyan-950 to-slate-950',
              liquidPrimary: '#06b6d4',
              liquidSecondary: '#0284c7',
              liquidGlow: 'rgba(6, 182, 212, 0.6)',
              bubbleColor: '#cffafe',
              badgeText: status === 'idle' ? '時間をセットしてスタート！' : '順調に反応中…',
              badgeBg: 'bg-cyan-500 text-slate-950 border-cyan-200',
              waveDuration: '3.8s',
              bubbleSpeedMultiplier: 1.15,
              bubbleCount: 14,
            };
        }
      }, [phase, status]);

      const bubbles = useMemo(() => {
        return Array.from({ length: 40 }, (_, i) => ({
          id: i,
          cx: 65 + ((i * 37) % 270),
          r: 5 + ((i * 13) % 16),
          delay: ((i * 0.29) % 3.5).toFixed(2),
          baseDuration: 1.8 + ((i * 0.41) % 2.2),
          wobble: (i % 2 === 0 ? 1 : -1) * (6 + (i % 10)),
        }));
      }, []);

      const confettiPieces = useMemo(() => {
        const colors = ['#f43f5e', '#facc15', '#38bdf8', '#4ade80', '#a855f7', '#fb923c', '#ffffff'];
        return Array.from({ length: 90 }, (_, i) => {
          const angle = (i / 90) * 360 + ((i * 17) % 15);
          const distance = 22 + ((i * 29) % 65);
          const tx = Math.cos((angle * Math.PI) / 180) * distance;
          const ty = Math.sin((angle * Math.PI) / 180) * distance - 10;
          return {
            id: i,
            color: colors[i % colors.length],
            size: 12 + (i % 16),
            tx: `${tx.toFixed(1)}vw`,
            ty: `${ty.toFixed(1)}vh`,
            rot: `${(i * 110) % 720}deg`,
            delay: `${((i % 12) * 0.035).toFixed(2)}s`,
            duration: `${(1.8 + (i % 7) * 0.25).toFixed(2)}s`,
            isCircle: i % 3 === 0,
          };
        });
      }, []);

      useEffect(() => {
        if (status !== 'running') return;
        const timer = setInterval(() => {
          setRemainingSeconds((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setStatus('exploded');
              if (!isMuted) sound.playExplosionAndFanfare();
              return 0;
            }
            const next = prev - 1;
            if (next <= 10 && !isMuted) sound.playCountdownBeep(next);
            return next;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [status, isMuted]);

      useEffect(() => {
        if (status === 'running' && prevPhaseRef.current === 'blue' && phase === 'yellow') {
          if (!isMuted) sound.playPhaseChange();
        }
        prevPhaseRef.current = phase;
      }, [phase, status, isMuted]);

      const handleSelectPreset = useCallback((seconds) => {
        if (!isMuted) sound.playTap(580);
        setTotalSeconds(seconds);
        setRemainingSeconds(seconds);
        setStatus('idle');
      }, [isMuted]);

      const handleAdjustTime = useCallback((deltaSeconds) => {
        if (!isMuted) sound.playTap(deltaSeconds > 0 ? 640 : 440);
        setTotalSeconds((prev) => {
          const next = Math.max(10, Math.min(5999, prev + deltaSeconds));
          setRemainingSeconds(next);
          return next;
        });
        setStatus('idle');
      }, [isMuted]);

      const handleStart = useCallback(() => {
        if (remainingSeconds <= 0) return;
        if (!isMuted) sound.playStart();
        setStatus('running');
      }, [remainingSeconds, isMuted]);

      const handleTogglePause = useCallback(() => {
        if (!isMuted) sound.playTap(520);
        setStatus((prev) => (prev === 'running' ? 'paused' : 'running'));
      }, [isMuted]);

      const handleReset = useCallback(() => {
        if (!isMuted) sound.playTap(420);
        setStatus('idle');
        setRemainingSeconds(totalSeconds);
      }, [totalSeconds, isMuted]);

      const handleToggleMute = useCallback(() => {
        setIsMuted((prev) => {
          const next = !prev;
          if (!next) sound.playTap(700);
          return next;
        });
      }, []);

      const formattedTime = useMemo(() => {
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }, [remainingSeconds]);

      const liquidY = useMemo(() => {
        if (status === 'idle') return 145;
        if (phase === 'red') return 120;
        const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 1;
        return Math.round(280 - ratio * 145);
      }, [status, phase, remainingSeconds, totalSeconds]);

      return (
        <div className={`relative h-screen w-screen overflow-hidden select-none bg-gradient-to-b ${theme.bgGradient} transition-colors duration-1000 flex flex-col justify-between items-center font-sans`}>
          <style>{`
            @keyframes waveSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-400px); } }
            @keyframes waveSlideReverse { 0% { transform: translateX(-400px); } 100% { transform: translateX(0); } }
            @keyframes bubbleRise { 0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; } 15% { opacity: 0.85; } 85% { opacity: 0.9; } 100% { transform: translateY(-320px) translateX(var(--wobble, 10px)) scale(1.25); opacity: 0; } }
            @keyframes steamPuff { 0% { transform: translateY(0) scale(0.5); opacity: 0.85; } 100% { transform: translateY(-95px) scale(2.1); opacity: 0; } }
            @keyframes franticShake { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 20% { transform: translate(-6px, -4px) rotate(-1.5deg); } 40% { transform: translate(6px, 3px) rotate(1.5deg); } 60% { transform: translate(-5px, 4px) rotate(-1deg); } 80% { transform: translate(5px, -3px) rotate(1deg); } }
            @keyframes numberShake { 0%, 100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.03) rotate(-1deg); } 50% { transform: scale(1.05) rotate(0deg); } 75% { transform: scale(1.03) rotate(1deg); } }
            @keyframes confettiBurst { 0% { transform: translate(0, 0) rotate(0deg) scale(0.4); opacity: 1; } 65% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.1); opacity: 0; } }
            @keyframes shockwaveExpand { 0% { transform: scale(0.2); opacity: 0.95; } 100% { transform: scale(3.6); opacity: 0; } }
            .timer-digits-shadow { -webkit-text-stroke: 10px #090d16; paint-order: stroke fill; text-shadow: 0 12px 0 #090d16, 0 22px 45px rgba(0, 0, 0, 0.85); }
            @media (max-width: 900px) { .timer-digits-shadow { -webkit-text-stroke: 7px #090d16; } }
          `}</style>

          <div className="pointer-events-none absolute inset-0 flex items-center justify-center transition-all duration-700" style={{ background: `radial-gradient(circle at 50% 54%, ${theme.liquidGlow} 0%, transparent 62%)` }} />
          {phase === 'red' && status === 'running' && <div className="pointer-events-none absolute inset-0 bg-red-600/15 animate-pulse z-0" />}

          <header className="relative z-30 w-full px-6 pt-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border-2 border-slate-700 px-4 py-2 rounded-2xl shadow-lg">
                <FlaskConical className="w-6 h-6 text-cyan-400" />
                <span className="text-white font-black tracking-wider text-base md:text-lg">フラスコタイマー</span>
              </div>
              <div className={`px-4 py-2 rounded-2xl font-black text-sm md:text-lg border-2 shadow-lg transition-all duration-300 flex items-center gap-2 ${theme.badgeBg}`}>
                {phase === 'red' && <Flame className="w-5 h-5 fill-current" />}
                {theme.badgeText}
              </div>
            </div>

            <div className="flex items-center gap-3">
              {(status === 'running' || status === 'paused') && (
                <>
                  <button onClick={handleTogglePause} className={`flex items-center gap-2 px-5 py-3 rounded-2xl font-black text-lg md:text-xl shadow-xl border-b-4 active:border-b-0 active:translate-y-1 transition-all ${status === 'paused' ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 border-emerald-700 animate-pulse' : 'bg-amber-400 hover:bg-amber-300 text-slate-950 border-amber-600'}`}>
                    {status === 'paused' ? <><Play className="w-6 h-6 fill-current" /><span>再開</span></> : <><Pause className="w-6 h-6 fill-current" /><span>一時停止</span></>}
                  </button>
                  <button onClick={handleReset} className="flex items-center gap-2 px-5 py-3 rounded-2xl font-black text-lg md:text-xl bg-slate-800 hover:bg-slate-700 text-white border-b-4 border-slate-950 shadow-xl active:border-b-0 active:translate-y-1 transition-all">
                    <RotateCcw className="w-6 h-6" /><span>リセット</span>
                  </button>
                </>
              )}
              <button onClick={handleToggleMute} className={`flex items-center gap-2 px-4 py-3 rounded-2xl font-black text-base md:text-lg border-b-4 shadow-xl active:border-b-0 active:translate-y-1 transition-all ${isMuted ? 'bg-slate-800 text-slate-400 border-slate-950' : 'bg-indigo-600 hover:bg-indigo-500 text-white border-indigo-900'}`}>
                {isMuted ? <><VolumeX className="w-6 h-6" /><span className="hidden sm:inline">音 OFF</span></> : <><Volume2 className="w-6 h-6" /><span className="hidden sm:inline">音 ON</span></>}
              </button>
            </div>
          </header>

          <div className="pointer-events-none absolute inset-0 flex items-center justify-center z-10" style={{ animation: phase === 'red' && status === 'running' ? 'franticShake 0.22s infinite ease-in-out' : 'none' }}>
            {status !== 'exploded' ? (
              <svg viewBox="0 0 400 450" className={`transition-all duration-500 ${status === 'idle' ? 'h-[66vh] w-[66vh] -translate-y-8' : 'h-[86vh] w-[86vh] translate-y-2'}`}>
                <defs>
                  <clipPath id="flaskInteriorClip"><path d="M 164 48 L 236 48 L 236 132 L 356 368 Q 374 405 332 405 L 68 405 Q 26 405 44 368 L 164 132 Z" /></clipPath>
                  <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor={theme.liquidPrimary} style={{ transition: 'stop-color 0.7s ease' }} />
                    <stop offset="100%" stopColor={theme.liquidSecondary} style={{ transition: 'stop-color 0.7s ease' }} />
                  </linearGradient>
                </defs>

                {(phase === 'yellow' || phase === 'red') && status === 'running' && (
                  <g>
                    {[0, 1, 2, 3, 4].map((idx) => (
                      <circle key={`steam-${idx}`} cx={175 + idx * 13} cy={38} r={phase === 'red' ? 14 : 9} fill={theme.bubbleColor} style={{ animationName: 'steamPuff', animationDuration: `${phase === 'red' ? 0.75 : 1.4}s`, animationTimingFunction: 'ease-out', animationIterationCount: 'infinite', animationDelay: `${idx * 0.18}s` }} />
                    ))}
                  </g>
                )}

                <path d="M 160 45 L 240 45 L 240 130 L 362 368 Q 382 410 335 410 L 65 410 Q 18 410 38 368 L 160 130 Z" fill="rgba(255, 255, 255, 0.08)" />

                <g clipPath="url(#flaskInteriorClip)">
                  <g style={{ transform: `translateY(${liquidY - 12}px)`, transition: 'transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)' }}>
                    <path d="M 0 20 Q 50 -6 100 20 T 200 20 T 300 20 T 400 20 T 500 20 T 600 20 T 700 20 T 800 20 L 800 450 L 0 450 Z" fill={theme.liquidSecondary} opacity="0.65" style={{ animation: `waveSlideReverse ${theme.waveDuration} linear infinite`, transition: 'fill 0.7s ease' }} />
                  </g>
                  <g style={{ transform: `translateY(${liquidY}px)`, transition: 'transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)' }}>
                    <path d={phase === 'red' ? 'M 0 22 Q 50 -14 100 22 T 200 22 T 300 22 T 400 22 T 500 22 T 600 22 T 700 22 T 800 22 L 800 450 L 0 450 Z' : 'M 0 22 Q 50 4 100 22 T 200 22 T 300 22 T 400 22 T 500 22 T 600 22 T 700 22 T 800 22 L 800 450 L 0 450 Z'} fill="url(#liquidGrad)" style={{ animation: `waveSlide ${theme.waveDuration} linear infinite` }} />
                  </g>
                  {bubbles.slice(0, theme.bubbleCount).map((b) => (
                    <circle key={b.id} cx={b.cx} cy={398} r={phase === 'red' ? b.r * 1.25 : b.r} fill={theme.bubbleColor} opacity="0.75" style={{ '--wobble': `${b.wobble}px`, animationName: 'bubbleRise', animationDuration: `${(b.baseDuration * theme.bubbleSpeedMultiplier).toFixed(2)}s`, animationTimingFunction: 'ease-in', animationIterationCount: 'infinite', animationDelay: `${b.delay}s`, animationPlayState: status === 'paused' ? 'paused' : 'running' }} />
                  ))}
                </g>

                <path d="M 168 142 L 62 352 Q 54 370 72 378" fill="none" stroke="rgba(255, 255, 255, 0.38)" strokeWidth="12" strokeLinecap="round" />
                <path d="M 174 62 L 174 122" fill="none" stroke="rgba(255, 255, 255, 0.38)" strokeWidth="9" strokeLinecap="round" />
                <g stroke="rgba(255, 255, 255, 0.55)" strokeWidth="4" strokeLinecap="round">
                  <line x1="255" y1="220" x2="278" y2="220" />
                  <line x1="270" y1="265" x2="300" y2="265" />
                  <line x1="285" y1="310" x2="320" y2="310" />
                  <line x1="300" y1="355" x2="342" y2="355" />
                </g>
                <path d="M 160 45 L 240 45 L 240 130 L 362 368 Q 382 410 335 410 L 65 410 Q 18 410 38 368 L 160 130 Z" fill="none" stroke="#ffffff" strokeWidth="12" strokeLinejoin="round" />
                <rect x="144" y="32" width="112" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" strokeWidth="3" />
              </svg>
            ) : (
              <div className="relative flex items-center justify-center w-full h-full">
                <div className="absolute w-72 h-72 rounded-full border-[16px] border-yellow-300" style={{ animationName: 'shockwaveExpand', animationDuration: '1.2s', animationTimingFunction: 'ease-out', animationIterationCount: 'infinite' }} />
                <div className="absolute w-72 h-72 rounded-full border-[12px] border-pink-400" style={{ animationName: 'shockwaveExpand', animationDuration: '1.2s', animationTimingFunction: 'ease-out', animationIterationCount: 'infinite', animationDelay: '0.35s' }} />
                <svg viewBox="0 0 500 500" className="w-[85vh] h-[85vh] animate-pulse">
                  <polygon points="250,15 295,110 395,55 365,155 475,165 395,245 480,330 370,345 405,445 300,395 250,485 200,395 95,445 130,345 20,330 105,245 25,165 135,155 105,55 205,110" fill="#ec4899" stroke="#ffffff" strokeWidth="10" strokeLinejoin="round" />
                  <polygon points="250,55 285,135 365,95 340,175 430,190 365,250 430,315 340,330 365,410 285,370 250,445 215,370 135,410 160,330 70,315 135,250 70,190 160,175 135,95 215,135" fill="#facc15" stroke="#fef08a" strokeWidth="8" strokeLinejoin="round" />
                  <circle cx="130" cy="140" r="42" fill="#ffffff" opacity="0.9" />
                  <circle cx="380" cy="135" r="38" fill="#ffffff" opacity="0.9" />
                  <circle cx="115" cy="365" r="45" fill="#ffffff" opacity="0.9" />
                  <circle cx="385" cy="365" r="40" fill="#ffffff" opacity="0.9" />
                </svg>
              </div>
            )}
          </div>

          {status === 'exploded' && (
            <div className="pointer-events-none absolute inset-0 flex items-center justify-center z-20 overflow-hidden">
              {confettiPieces.map((c) => (
                <div key={c.id} style={{ width: `${c.size}px`, height: c.isCircle ? `${c.size}px` : `${c.size * 0.6}px`, backgroundColor: c.color, borderRadius: c.isCircle ? '9999px' : '4px', '--tx': c.tx, '--ty': c.ty, '--rot': c.rot, animationName: 'confettiBurst', animationDuration: c.duration, animationTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)', animationIterationCount: 'infinite', animationDelay: c.delay }} className="absolute shadow-md" />
              ))}
            </div>
          )}

          <main className="relative z-20 flex-1 w-full flex flex-col items-center justify-center px-4">
            {status !== 'exploded' ? (
              <div className={`flex flex-col items-center justify-center transition-transform duration-300 ${status === 'idle' ? '-translate-y-4' : 'translate-y-2'}`} style={{ animation: phase === 'red' && status === 'running' ? 'numberShake 0.35s infinite ease-in-out' : 'none' }}>
                <div className={`font-black tabular-nums tracking-tight leading-none select-none timer-digits-shadow transition-all duration-300 ${status === 'idle' ? 'text-[20vw] text-white' : phase === 'red' ? 'text-[24vw] text-yellow-200' : 'text-[24vw] text-white'}`}>
                  {formattedTime}
                </div>
                {status === 'paused' && <div className="mt-2 px-8 py-3 rounded-full bg-amber-400 text-slate-950 font-black text-2xl md:text-3xl shadow-2xl border-4 border-white animate-bounce">一時停止中（右上の「再開」をタップ）</div>}
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center text-center z-30 animate-fade-in">
                <div className="flex items-center gap-3 bg-yellow-300 text-slate-950 px-6 py-2 rounded-full font-black text-2xl md:text-3xl border-4 border-white shadow-xl mb-3 animate-bounce">
                  <Sparkles className="w-8 h-8 fill-current" /><span>実験終了！！</span><Sparkles className="w-8 h-8 fill-current" />
                </div>
                <h1 className="text-[15vw] leading-none font-black text-white tracking-tight timer-digits-shadow">TIME UP!</h1>
                <p className="mt-2 text-4xl md:text-6xl font-black text-yellow-300 drop-shadow-[0_6px_6px_rgba(0,0,0,0.9)]">終了！手を止めよう！</p>
                <button onClick={handleReset} className="mt-8 flex items-center gap-4 px-10 py-5 rounded-3xl bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-slate-950 font-black text-3xl md:text-4xl border-4 border-white shadow-[0_10px_0_#065f46,0_20px_35px_rgba(0,0,0,0.6)] active:translate-y-2 active:shadow-[0_4px_0_#065f46] transition-all">
                  <RefreshCw className="w-9 h-9 stroke-[3]" /><span>もう1回（設定に戻る）</span>
                </button>
              </div>
            )}
          </main>

          {status === 'idle' && (
            <footer className="relative z-30 w-full max-w-6xl px-6 pb-5 flex flex-col gap-3">
              <div className="bg-slate-900/85 backdrop-blur-md border-2 border-slate-700/90 rounded-3xl p-4 shadow-2xl flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
                  <span className="text-slate-300 font-bold text-sm md:text-base px-2">かんたん設定</span>
                  {[{ label: '1分', sec: 60 }, { label: '3分', sec: 180 }, { label: '5分', sec: 300 }, { label: '10分', sec: 600 }].map((preset) => (
                    <button key={preset.sec} onClick={() => handleSelectPreset(preset.sec)} className={`px-5 py-3.5 rounded-2xl font-black text-xl md:text-2xl border-b-4 transition-all active:border-b-0 active:translate-y-1 ${totalSeconds === preset.sec ? 'bg-cyan-400 text-slate-950 border-cyan-700 shadow-[0_0_20px_rgba(34,211,238,0.6)] scale-105' : 'bg-slate-800 hover:bg-slate-700 text-white border-slate-950'}`}>
                      {preset.label}
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-2 sm:gap-3">
                  <span className="text-slate-300 font-bold text-sm md:text-base px-1">微調整</span>
                  <button onClick={() => handleAdjustTime(60)} className="flex items-center gap-1 px-4 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg md:text-xl border-b-4 border-indigo-900 active:border-b-0 active:translate-y-1 transition-all"><Plus className="w-5 h-5 stroke-[3]" /><span>1分</span></button>
                  <button onClick={() => handleAdjustTime(10)} className="flex items-center gap-1 px-4 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg md:text-xl border-b-4 border-indigo-900 active:border-b-0 active:translate-y-1 transition-all"><Plus className="w-5 h-5 stroke-[3]" /><span>10秒</span></button>
                  <button onClick={() => handleAdjustTime(-10)} className="flex items-center gap-1 px-4 py-3.5 rounded-2xl bg-rose-700 hover:bg-rose-600 text-white font-black text-lg md:text-xl border-b-4 border-rose-950 active:border-b-0 active:translate-y-1 transition-all"><Minus className="w-5 h-5 stroke-[3]" /><span>10秒</span></button>
                </div>
                <button onClick={handleStart} className="flex items-center justify-center gap-3 px-9 py-4 rounded-2xl bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-slate-950 font-black text-2xl md:text-3xl border-b-4 border-emerald-800 shadow-[0_0_25px_rgba(16,185,129,0.6)] active:border-b-0 active:translate-y-1 transition-all ml-auto">
                  <Play className="w-8 h-8 fill-current" /><span>スタート！</span>
                </button>
              </div>
            </footer>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
